<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React Mini Example: Watchlist & Array State</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161e30; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 380px; border: 1px solid #263554; }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 6px; outline: none; }
    button.add-btn { background: #0284c7; color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 0.6rem 0.85rem; border-radius: 6px; margin-bottom: 0.5rem; }
    button.del-btn { background: #ef4444; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function WatchlistApp() {
      const [stocks, setStocks] = useState(["RELIANCE", "TCS", "INFY"]);
      const [inputVal, setInputVal] = useState("");

      function handleAdd() {
        if (!inputVal.trim()) return;
        const formatted = inputVal.trim().toUpperCase();
        if (!stocks.includes(formatted)) {
          // Spread operator to create a new array without mutating state directly!
          setStocks(prev => [...prev, formatted]);
        }
        setInputVal("");
      }

      function handleDelete(ticker) {
        // Filter creates a new array excluding the clicked ticker
        setStocks(prev => prev.filter(s => s !== ticker));
      }

      return (
        <div className="card">
          <h2>📊 Stock Watchlist</h2>
          <div className="input-row">
            <input 
              type="text" 
              placeholder="e.g. HDFCBANK" 
              value={inputVal}
              onChange={e => setInputVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleAdd()}
            />
            <button className="add-btn" onClick={handleAdd}>Add</button>
          </div>
          <ul>
            {stocks.map(ticker => (
              <li key={ticker}>
                <span><strong>{ticker}</strong></span>
                <button className="del-btn" onClick={() => handleDelete(ticker)}>Remove</button>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WatchlistApp />);
  </script>
</body>
</html>
